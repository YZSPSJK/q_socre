{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="分页">
  {% if page.has_previous %}<a class="button" href="{% querystring page=page.previous_page_number %}">上一页</a>{% endif %}
  <span>第 {{ page.number }} 页，共 {{ page.paginator.num_pages }} 页</span>
  {% if page.has_next %}<a class="button" href="{% querystring page=page.next_page_number %}">下一页</a>{% endif %}
</nav>
{% endif %}
